<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VinylVision</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg:#e8e6e1; --dim:#8a8782; --accent:#e0b34c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; color:var(--fg);
    font:16px/1.5 -apple-system, "Helvetica Neue", sans-serif; overflow:hidden; }
  .layer { position:fixed; inset:0; transition:opacity .8s; }
  .layer.off { opacity:0; pointer-events:none; }

  #video, #genvid { width:100%; height:100%; object-fit:contain; background:#000; }
  #genvid { object-fit:cover; }

  /* idle screen */
  #idle { display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2.2rem; }
  .disc { width:180px; height:180px; border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #111 0 18%, transparent 18%),
      repeating-radial-gradient(circle at 50% 50%, #181818 0 2px, #0c0c0c 2px 4px);
    border:1px solid #222; position:relative; animation:spin 1.8s linear infinite; }
  .disc::after { content:""; position:absolute; inset:38%; border-radius:50%;
    background:var(--accent); }
  .disc::before { content:""; position:absolute; left:50%; top:50%;
    width:8px; height:8px; margin:-4px; border-radius:50%; background:#000; z-index:1; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #statusMain { font-size:1.5rem; font-weight:600; letter-spacing:.01em; }
  #statusSub  { color:var(--dim); font-size:.95rem; max-width:34rem; text-align:center; }

  /* vibe: visualizer + hologram */
  #viz { position:absolute; inset:0; width:100%; height:100%; }
  #holoWrap { position:absolute; left:50%; top:34%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none; }
  #holo { width:min(34vh,34vw); border-radius:8px; position:relative;
    box-shadow:0 0 60px rgba(80,255,200,.25), 0 0 120px rgba(160,100,255,.15);
    animation:float 7s ease-in-out infinite; display:none; }
  #holoWrap::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(120,255,220,.05) 0 1px, transparent 1px 4px); }
  @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-12px) } }
  #vibeTitle { margin-top:1.4rem; font-size:clamp(1.4rem, 3.4vw, 2.6rem); font-weight:700;
    text-shadow:0 0 24px rgba(120,255,220,.5); }
  #vibeSub { color:var(--dim); font-size:1rem; margin-top:.3rem; }
  #genTitle { position:absolute; left:2rem; bottom:5.5rem; font-size:1.3rem; font-weight:700;
    text-shadow:0 2px 18px #000, 0 0 30px rgba(0,0,0,.9); opacity:.9; }

  /* now playing chip */
  #chip { position:fixed; left:50%; bottom:2.2rem; transform:translateX(-50%);
    background:rgba(10,10,10,.72); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    padding:.7rem 1.1rem; display:flex; align-items:center; gap:.9rem;
    opacity:0; transition:opacity .5s; white-space:nowrap; z-index:10; }
  body.showchip #chip, body:hover #chip { opacity:1; }
  #chip .dot { width:9px; height:9px; border-radius:50%; background:#3ddc84;
    box-shadow:0 0 8px #3ddc84; flex:none; }
  #chip .dot.warn { background:var(--accent); box-shadow:0 0 8px var(--accent); }
  #track { font-weight:600; }
  #chip button { background:rgba(255,255,255,.08); color:var(--fg); border:0;
    border-radius:8px; padding:.25rem .6rem; font-size:.85rem; cursor:pointer; }
  #chip button:hover { background:rgba(255,255,255,.16); }
  #listenBtn { color:#7df2c8; font-weight:600; }
  #nudgeVal { color:var(--dim); font-size:.8rem; min-width:3.4rem; text-align:center; }
</style>
</head>
<body>
  <div class="layer" id="videoLayer"><video id="video" muted playsinline></video></div>

  <div class="layer off" id="vibe">
    <canvas id="viz"></canvas>
    <div id="holoWrap">
      <img id="holo" alt="">
      <div id="vibeTitle"></div>
      <div id="vibeSub"></div>
    </div>
  </div>

  <div class="layer off" id="genLayer">
    <video id="genvid" muted playsinline loop></video>
    <div id="genTitle"></div>
  </div>

  <div class="layer" id="idle">
    <div class="disc"></div>
    <div id="statusMain">Listening to the room…</div>
    <div id="statusSub">Drop the needle. I'll find the video.</div>
  </div>

  <div id="chip">
    <div class="dot" id="dot"></div>
    <span id="track">—</span>
    <button id="listenBtn" title="force re-identify now">👂 Listen</button>
    <button id="minus" title="video earlier">−0.1s</button>
    <span id="nudgeVal">0.00s</span>
    <button id="plus" title="video later">+0.1s</button>
    <button id="fs">⛶</button>
  </div>

<script>
const $ = id => document.getElementById(id);
const video = $('video');
const genvid = $('genvid');
let ws = null;

/* ---------- layers ---------- */
const LAYERS = ['videoLayer','vibe','genLayer','idle'];
function show(name){
  for (const l of LAYERS) $(l).classList.toggle('off', l !== name);
  vizOn = (name === 'vibe');
  if (name !== 'videoLayer') video.pause();
  if (name !== 'genLayer') genvid.pause();
}

/* ---------- chip / nudge ---------- */
let nudge = parseFloat(localStorage.getItem('vv_nudge') || '0');
let chipTimer = null;
function showNudge(){ $('nudgeVal').textContent = (nudge>=0?'+':'') + nudge.toFixed(2) + 's'; }
function setNudge(d){
  nudge = Math.round((nudge + d) * 100) / 100;
  localStorage.setItem('vv_nudge', nudge);
  if (!video.paused) video.currentTime += d;
  showNudge(); flashChip();
}
showNudge();
$('minus').onclick = () => setNudge(-0.1);
$('plus').onclick = () => setNudge(+0.1);
$('listenBtn').onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({cmd:'listen'}));
  $('statusMain').textContent = 'Listening hard…'; $('statusSub').textContent = '';
  flashChip();
};
$('fs').onclick = () =>
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
document.body.ondblclick = e => { if (e.target.tagName !== 'BUTTON') $('fs').onclick(); };
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') setNudge(-0.1);
  if (e.key === 'ArrowRight') setNudge(+0.1);
  if (e.key === 'f') $('fs').onclick();
  if (e.key === 'l') $('listenBtn').onclick();
});
function flashChip(){
  document.body.classList.add('showchip');
  clearTimeout(chipTimer);
  chipTimer = setTimeout(() => document.body.classList.remove('showchip'), 4000);
}

/* ---------- synced video ---------- */
let curUrl = null;
function applySync(m){
  const target = () => m.pos + (Date.now()/1000 - m.at) + nudge;
  const seekPlay = () => {
    video.currentTime = target();
    video.playbackRate = 1;
    video.play().catch(()=>{});
    show('videoLayer');
  };
  if (m.url !== curUrl) {
    curUrl = m.url;
    video.src = m.url;
    video.onloadedmetadata = seekPlay;
    video.load();
  } else if (m.hard || video.paused || Math.abs(target() - video.currentTime) > 0.75) {
    seekPlay();
  } else {
    const err = target() - video.currentTime;
    video.playbackRate = Math.max(0.94, Math.min(1.06, 1 + err / 8));
  }
  $('track').textContent = `${m.artist} — ${m.title}`;
  $('dot').className = 'dot' + (m.conf < 8 ? ' warn' : '');
  flashChip();
}

/* ---------- status handling ---------- */
const STATUS_TEXT = {
  mic:       ['Waiting for microphone access…', 'Approve the mic prompt for your terminal (System Settings → Privacy & Security → Microphone).'],
  listening: ['Listening to the room…', 'Drop the needle. I\'ll find the video.'],
  silent:    ['Room is quiet', 'Waiting for music. (If a record IS playing, check mic permission / volume.)'],
  fetching:  ['Fetching the video…', ''],
  locking:   ['Syncing to the groove…', ''],
};

function onMessage(m){
  if (m.type === 'audio') { AF.push(m); return; }
  if (m.type === 'sync') { applySync(m); return; }
  if (m.type === 'pause') { video.pause(); genvid.pause(); return; }
  if (m.type !== 'status') return;

  if (m.state === 'vibe') {
    $('track').textContent = `${m.artist} — ${m.title}`;
    if (m.gen) {
      if (genvid.getAttribute('src') !== m.gen) { genvid.src = m.gen; genvid.load(); }
      genvid.play().catch(()=>{});
      $('genTitle').textContent = `${m.artist} — ${m.title}`;
      show('genLayer');
    } else {
      $('holo').src = m.art || '';
      $('holo').style.display = m.art ? 'inline' : 'none';
      $('vibeTitle').textContent = `${m.artist} — ${m.title}`;
      $('vibeSub').textContent = 'no music video exists — conjuring one…';
      show('vibe');
    }
    flashChip();
    return;
  }
  const t = STATUS_TEXT[m.state] || [m.state, ''];
  if (m.state === 'fetching' && m.artist) {
    $('statusMain').textContent = `Found: ${m.artist} — ${m.title}`;
    $('statusSub').textContent = 'Grabbing the music video…';
  } else {
    $('statusMain').textContent = t[0];
    $('statusSub').textContent = m.detail || t[1];
  }
  if (m.state !== 'locking') show('idle');
}

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => onMessage(JSON.parse(e.data));
  ws.onclose = () => { show('idle'); $('statusMain').textContent='Reconnecting…'; setTimeout(connect, 1500); };
}
connect();

/* ---------- audio features + beat detection ---------- */
const AF = {
  rms:0, bass:0, mid:0, treb:0,           // smoothed, normalized 0..1
  _max:{rms:.01, bass:.01, mid:.01, treb:.01},
  _hist:[], beat:0, _lastBeat:0,
  push(m){
    for (const k of ['rms','bass','mid','treb']){
      this._max[k] = Math.max(this._max[k]*0.999, m[k], 1e-4);
      const v = m[k]/this._max[k];
      this[k] += (v - this[k]) * 0.45;
    }
    this._hist.push(this.bass);
    if (this._hist.length > 40) this._hist.shift();
    const avg = this._hist.reduce((a,b)=>a+b,0)/this._hist.length;
    const now = performance.now();
    if (this.bass > avg*1.30 + 0.06 && now - this._lastBeat > 280){
      this._lastBeat = now; this.beat = 1;
    }
  },
};

/* ---------- the saber visualizer ---------- */
const cv = $('viz'), ctx = cv.getContext('2d');
let vizOn = false, W=0, H=0;
function resize(){ W = cv.width = innerWidth*devicePixelRatio; H = cv.height = innerHeight*devicePixelRatio; }
addEventListener('resize', resize); resize();

const stars = Array.from({length:220}, () => ({
  a: Math.random()*Math.PI*2, d: Math.random()*Math.max(innerWidth,innerHeight),
  s: 0.4 + Math.random()*1.2 }));
const embers = Array.from({length:60}, () => ({
  x: Math.random(), y: Math.random(), vy: 0.0004+Math.random()*0.0012,
  wob: Math.random()*6.28, r: 1+Math.random()*2.5 }));
let sparks = [];
let swing = 0, flash = 0;

function sabers(t){
  // pivots at bottom corners; blades cross mid-screen
  const L = Math.min(W,H)*0.78 * (0.88 + AF.bass*0.28);
  const defs = [
    {px:W*0.16, py:H*1.06, base:-0.38, col:'#39f5b0', dir: 1},
    {px:W*0.84, py:H*1.06, base: 0.38, col:'#b06bff', dir:-1},
  ];
  const tips = [];
  for (const s of defs){
    const ang = s.base + s.dir*(Math.sin(t*0.0007)*0.05 + AF.mid*0.10 + swing*0.5);
    const dx = Math.sin(ang), dy = -Math.cos(ang);  // blade points up, tilted
    tips.push({x0:s.px, y0:s.py, x1:s.px+dx*L, y1:s.py+dy*L, col:s.col});
  }
  // draw blades with crackle
  ctx.globalCompositeOperation = 'lighter';
  for (const b of tips){
    const segs = 14, jit = (1 + AF.treb*4) * devicePixelRatio;
    const pts = [];
    for (let i=0;i<=segs;i++){
      const u = i/segs;
      const nx = -(b.y1-b.y0), ny = (b.x1-b.x0);
      const nl = Math.hypot(nx,ny) || 1;
      const j = (i===0||i===segs) ? 0 : (Math.random()*2-1)*jit;
      pts.push([b.x0+(b.x1-b.x0)*u + nx/nl*j, b.y0+(b.y1-b.y0)*u + ny/nl*j]);
    }
    for (const [w2, alpha, col] of [[26,.06,b.col],[14,.14,b.col],[7,.35,b.col],[3,.95,'#ffffff']]){
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (const p of pts) ctx.lineTo(p[0], p[1]);
      ctx.strokeStyle = col; ctx.globalAlpha = alpha * (0.75 + AF.rms*0.5);
      ctx.lineWidth = w2*devicePixelRatio; ctx.lineCap = 'round';
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  // intersection flash + sparks on beat
  const [A,B] = tips;
  const den = (A.x1-A.x0)*(B.y1-B.y0) - (A.y1-A.y0)*(B.x1-B.x0);
  if (Math.abs(den) > 1e-6){
    const s2 = ((B.x0-A.x0)*(B.y1-B.y0) - (B.y0-A.y0)*(B.x1-B.x0)) / den;
    if (s2 > 0 && s2 < 1){
      const ix = A.x0 + (A.x1-A.x0)*s2, iy = A.y0 + (A.y1-A.y0)*s2;
      if (AF.beat){
        AF.beat = 0; swing = 0.22; flash = 1;
        for (let i=0;i<26;i++){
          const a = Math.random()*Math.PI*2, v = (2+Math.random()*7)*devicePixelRatio;
          sparks.push({x:ix, y:iy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1,
                       col: Math.random()<.5 ? '#9dffdd' : '#d9b8ff'});
        }
      }
      if (flash > 0.02){
        const g = ctx.createRadialGradient(ix,iy,0, ix,iy, 140*devicePixelRatio*flash);
        g.addColorStop(0, `rgba(255,255,255,${0.55*flash})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      }
    }
  }
  swing *= 0.86; flash *= 0.88;
}

function render(t){
  requestAnimationFrame(render);
  if (!vizOn) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,3,0.32)';
  ctx.fillRect(0,0,W,H);
  // starfield warp
  const cx = W/2, cy = H/2, sp = 0.35 + AF.rms*6;
  ctx.globalCompositeOperation = 'lighter';
  for (const st of stars){
    const d0 = st.d;
    st.d += sp * st.s * (st.d*0.004 + 0.6) * devicePixelRatio;
    const maxd = Math.hypot(W,H)*0.55;
    if (st.d > maxd){ st.d = Math.random()*30; st.a = Math.random()*Math.PI*2; continue; }
    const x0 = cx + Math.cos(st.a)*d0, y0 = cy + Math.sin(st.a)*d0;
    const x1 = cx + Math.cos(st.a)*st.d, y1 = cy + Math.sin(st.a)*st.d;
    ctx.strokeStyle = 'rgba(190,210,255,0.5)';
    ctx.globalAlpha = Math.min(1, st.d/maxd + 0.15);
    ctx.lineWidth = st.s*devicePixelRatio;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // embers
  for (const e of embers){
    e.y -= e.vy*(0.5+AF.mid*2); e.wob += 0.02;
    if (e.y < -0.05){ e.y = 1.05; e.x = Math.random(); }
    const ex = (e.x + Math.sin(e.wob)*0.01)*W, ey = e.y*H;
    ctx.fillStyle = `rgba(255,${150+AF.mid*90|0},70,${0.25+AF.mid*0.5})`;
    ctx.beginPath(); ctx.arc(ex,ey, e.r*devicePixelRatio*(0.7+AF.mid), 0, 6.29); ctx.fill();
  }
  sabers(t);
  // sparks
  sparks = sparks.filter(p => p.life > 0);
  for (const p of sparks){
    p.x += p.vx; p.y += p.vy; p.vy += 0.25*devicePixelRatio; p.life -= 0.035;
    ctx.fillStyle = p.col; ctx.globalAlpha = p.life;
    ctx.fillRect(p.x, p.y, 2.4*devicePixelRatio, 2.4*devicePixelRatio);
  }
  ctx.globalAlpha = 1;
  // hologram flicker
  const holo = $('holo');
  if (holo.style.display !== 'none') holo.style.opacity = 0.88 + AF.treb*0.12*Math.random();
}
requestAnimationFrame(render);
</script>
</body>
</html>
